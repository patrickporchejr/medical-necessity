# The hard split (G1.2): edited copies of cohort charts, and the answers we wrote for them.
#
# data/hard/build.py reads this file and builds data/synthea/hard/. Each case copies one base chart
# (`base`, its 8-character key, never one in evals/held_out.txt) under a new patient id,
# uuid5(NAMESPACE_URL, "hard/" + name), whose first 8 characters are `key`, and appends the records in
# `edits`. Nothing in the base chart is changed or removed. An edit's `id` is
# uuid5(NAMESPACE_URL, "hard/<name>/<n>"), n its place in the list; a note's `text` follows a first line
# holding its date, as Synthea writes notes.
#
# `criteria` gives, per criterion, the answer we expect (`evidence`, `gap`, or `pending-CPG1` for the one
# call left to you at CPG1), the records that settle it (`Type/id`; for notes, the newest three at most),
# and a one-line reason. Dates are judged at the cohort's as-of date, 2026-09-20.
#
# A criterion the case's edits do not touch takes the base chart's answer under the current rule
# ("Unchanged from the base"). A case aims at one or two criteria; the rest are there so every
# criterion of every case is scored.
#
# Bases: for each kind, the charts outside held-out (and outside Runs 0-3, which prompts were tuned on)
# in the situation the edit needs, fewest notes first where the pool allows, so labeling stays cheap. Each base is
# used once.
#
# `sparse-situation` cases fill the two situations the cohort has once each (D16, D17); `situation` is
# what evals' stratum_of gives the built chart, and `--check` confirms it. The 228-patient cohort has:
#   ra-active/trial-not-shown/no-active-notes      1
#   ra-not-active/trial-not-shown/active-notes     1
# and none of the four ra-not-active/no-order and ra-not-active/trial-shown situations, which are not
# built here (see the G1.2 handoff).

