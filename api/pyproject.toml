[project]
name = "medical-necessity-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "mcp>=1.2,<2",
  "pyyaml>=6",
  "anthropic>=1.7",
  "google-genai>=2",
  "logfire>=5",
  "genai-prices",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pydantic-evals[logfire]>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.logfire]
# Graph nodes are wrapped in spans; where nothing configured Logfire (a unit test, a script)
# those are silent no-ops, not something to warn about. The app calls setup_observability().
ignore_no_config = true
