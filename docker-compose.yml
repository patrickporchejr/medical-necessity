services:
  api:
    build: ./api
    env_file: .env
    environment:
      MCP_URL: http://mcp:8001/mcp
    ports: ["8000:8000"]
    # The API reads the chart only through the mcp service; it needs the payer criteria itself.
    volumes: ["./api:/srv", "./data/payer_criteria:/data/payer_criteria:ro"]
    depends_on: [mcp]
  mcp:
    build: ./api
    env_file: .env
    command: python -m app.mcp.server
    environment:
      MCP_HOST: 0.0.0.0
    ports: ["8001:8001"]
    volumes: ["./api:/srv", "./data:/data"]
  web:
    build: ./web
    ports: ["3000:3000"]
    volumes: ["./web:/app", "/app/node_modules", "/app/.next"]
    depends_on: [api]
